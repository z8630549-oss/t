

<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UzAI — AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0b0d12;
      color: #fff;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid #252936;
      background: #11141b;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
    }

    .logo span {
      color: #7c5cff;
    }

    .settings-btn {
      background: #20242e;
      border: 1px solid #303541;
      color: white;
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 20px;
      display: flex;
      gap: 12px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #735cff;
    }

    .user .avatar {
      background: #2b303c;
    }

    .bubble {
      background: #171a22;
      border: 1px solid #272b36;
      padding: 13px 16px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      flex-direction: row-reverse;
    }

    .user .bubble {
      background: #25202f;
    }

    .bottom {
      padding: 15px;
      border-top: 1px solid #252936;
      background: #11141b;
    }

    .input-area {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      min-height: 52px;
      max-height: 150px;
      resize: vertical;
      padding: 15px;
      border-radius: 13px;
      border: 1px solid #303541;
      background: #191c24;
      color: white;
      outline: none;
      font-size: 15px;
    }

    textarea:focus {
      border-color: #735cff;
    }

    .send {
      width: 55px;
      border: none;
      border-radius: 13px;
      background: #735cff;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .send:hover {
      background: #6349ed;
    }

    .voice {
      margin-top: 8px;
      font-size: 12px;
      color: #999eab;
      cursor: pointer;
    }

    /* MODAL */

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 500px;
      background: #171a22;
      border: 1px solid #303541;
      border-radius: 18px;
      padding: 25px;
    }

    .modal h2 {
      margin-top: 0;
    }

    .modal label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      color: #bbb;
      font-size: 13px;
    }

    .modal input {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #303541;
      background: #0f1117;
      color: white;
      outline: none;
    }

    .save {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #735cff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .close {
      float: right;
      cursor: pointer;
      color: #aaa;
    }

    .status {
      color: #9298a7;
      font-size: 12px;
      margin-top: 8px;
    }

    @media(max-width:600px) {
      .chat {
        padding: 15px;
      }

      .bottom {
        padding: 10px;
      }

      .message {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">Uz<span>AI</span> 🤖</div>

    <button class="settings-btn" onclick="openSettings()">
      ⚙️ Sozlamalar
    </button>
  </header>

  <main class="chat" id="chat">

    <div class="message">
      <div class="avatar">🤖</div>

      <div class="bubble">
        Salom! 👋 Men UzAI yordamchisiman.
        Menga istalgan savolingizni yozishingiz mumkin.
      </div>
    </div>

  </main>

  <div class="bottom">

    <div class="input-area">

      <textarea
        id="message"
        placeholder="AI ga xabar yozing..."
        onkeydown="handleKey(event)"
      ></textarea>

      <button class="send" onclick="sendMessage()">
        ➤
      </button>

    </div>

    <div class="status" id="status">
      Tayyor
    </div>

  </div>

</div>


<!-- SETTINGS -->

<div class="modal-bg" id="modal">

  <div class="modal">

    <span class="close" onclick="closeSettings()">✕</span>

    <h2>⚙️ API sozlamalari</h2>

    <label>OpenAI API Key</label>

    <input
      id="openaiKey"
      type="password"
      placeholder="sk-..."
    >

    <label>VoiceLab API Key</label>

    <input
      id="voiceKey"
      type="password"
      placeholder="vlk_..."
    >

    <button class="save" onclick="saveKeys()">
      Saqlash
    </button>

    <p style="font-size:12px;color:#888;line-height:1.5">
      API kalitlaringiz brauzerning localStorage xotirasida
      saqlanadi. Ularni hech kimga yubormang.
    </p>

  </div>

</div>


<script>

let messages = [
  {
    role: "system",
    content:
      "Sen UzAI nomli yordamchisan. Foydalanuvchi bilan o'zbek tilida, tushunarli va foydali tarzda suhbatlash."
  }
];


// =========================
// SETTINGS
// =========================

function openSettings() {

  document.getElementById("modal").style.display = "flex";

  document.getElementById("openaiKey").value =
    localStorage.getItem("openai_key") || "";

  document.getElementById("voiceKey").value =
    localStorage.getItem("voice_key") || "";
}


function closeSettings() {
  document.getElementById("modal").style.display = "none";
}


function saveKeys() {

  const openai = document
    .getElementById("openaiKey")
    .value
    .trim();

  const voice = document
    .getElementById("voiceKey")
    .value
    .trim();

  localStorage.setItem("openai_key", openai);
  localStorage.setItem("voice_key", voice);

  closeSettings();

  document.getElementById("status").textContent =
    "API sozlamalari saqlandi.";
}


// =========================
// CHAT UI
// =========================

function addMessage(role, text) {

  const chat = document.getElementById("chat");

  const message = document.createElement("div");

  message.className =
    "message " + (role === "user" ? "user" : "");

  const avatar =
    role === "user" ? "👤" : "🤖";

  message.innerHTML = `
    <div class="avatar">${avatar}</div>

    <div>
      <div class="bubble"></div>

      ${
        role === "assistant"
        ? `<div class="voice" onclick="speakLast(this)">
             🔊 Ovoz chiqarish
           </div>`
        : ""
      }
    </div>
  `;

  message.querySelector(".bubble").textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}


// =========================
// SEND MESSAGE
// =========================

async function sendMessage() {

  const input =
    document.getElementById("message");

  const text = input.value.trim();

  if (!text) return;

  const apiKey =
    localStorage.getItem("openai_key");

  if (!apiKey) {

    openSettings();

    alert(
      "Avval OpenAI API key kiriting."
    );

    return;
  }

  input.value = "";

  addMessage("user", text);

  messages.push({
    role: "user",
    content: text
  });

  const assistantMessage =
    addMessage(
      "assistant",
      "⏳ O'ylayapman..."
    );

  const bubble =
    assistantMessage.querySelector(".bubble");

  document.getElementById("status").textContent =
    "AI javob tayyorlamoqda...";

  try {

    const response = await fetch(
      "https://api.openai.com/v1/chat/completions",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization":
            "Bearer " + apiKey
        },

        body: JSON.stringify({

          model: "gpt-4o-mini",

          messages: messages,

          temperature: 0.7

        })
      }
    );


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(
        "OpenAI API xatosi: " +
        response.status +
        "\n" +
        error
      );
    }


    const data =
      await response.json();

    const answer =
      data.choices?.[0]?.message?.content ||
      "Javob olinmadi.";

    bubble.textContent = answer;

    messages.push({
      role: "assistant",
      content: answer
    });

    document.getElementById("status").textContent =
      "Tayyor";

    /*
      VoiceLab'ga yuborish
    */

    speakWithVoiceLab(answer);

  } catch (error) {

    console.error(error);

    bubble.textContent =
      "❌ Xatolik:\n" +
      error.message;

    document.getElementById("status").textContent =
      "Xatolik yuz berdi.";
  }
}


// =========================
// ENTER
// =========================

function handleKey(event) {

  if (
    event.key === "Enter" &&
    !event.shiftKey
  ) {

    event.preventDefault();

    sendMessage();
  }
}


// =========================
// VOICELAB
// =========================

async function speakWithVoiceLab(text) {

  const voiceKey =
    localStorage.getItem("voice_key");

  if (!voiceKey) {
    console.log(
      "VoiceLab API key mavjud emas."
    );
    return;
  }


  /*
    MUHIM:

    Bu endpointni VoiceLab documentationdagi
    "Generate speech" endpointiga moslang.

    Quyidagi URL namuna sifatida qoldirilgan.
  */

  try {

    const response = await fetch(
      "https://api.voicelab.uz/v1/speech",
      {

        method: "POST",

        headers: {

          "Authorization":
            "Bearer " + voiceKey,

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          text: text,

          voice: "Lola",

          language: "uz"

        })

      }
    );


    if (!response.ok) {

      console.log(
        "VoiceLab error:",
        await response.text()
      );

      return;
    }


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if (contentType.includes("audio")) {

      const blob =
        await response.blob();

      const url =
        URL.createObjectURL(blob);

      const audio =
        new Audio(url);

      audio.play();

    } else {

      const data =
        await response.json();

      console.log(
        "VoiceLab:",
        data
      );

      if (data.audio_url) {

        const audio =
          new Audio(data.audio_url);

        audio.play();
      }
    }

  } catch (error) {

    console.error(
      "VoiceLab xatosi:",
      error
    );
  }
}


// =========================
// LAST MESSAGE VOICE
// =========================

function speakLast(element) {

  const message =
    element
      .parentElement
      .querySelector(".bubble")
      .textContent;

  speakWithVoiceLab(message);
}

</script>

</body>
</html>
